<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>신나는 구구단 연습 게임 🎮</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Round&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Jua', 'Nanum Round', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #FFF9E6 0%, #E8F5E9 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .game-card {
      background: #FFFFFF;
      width: 100%;
      max-width: 480px;
      border-radius: 36px;
      padding: 36px 28px;
      box-shadow: 0 16px 32px rgba(99, 133, 102, 0.18);
      text-align: center;
      border: 4px solid #FFD54F;
      position: relative;
      overflow: hidden;
    }

    .badge-deco {
      position: absolute;
      top: -12px;
      right: 24px;
      background: #FF6F61;
      color: white;
      font-size: 15px;
      padding: 8px 16px;
      border-radius: 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      transform: rotate(4deg);
    }

    h1 {
      font-size: 32px;
      color: #388E3C;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    p.subtitle {
      font-size: 18px;
      color: #795548;
      margin-bottom: 24px;
    }

    /* 점수판 */
    .score-board {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 24px;
      background: #FFFDE7;
      padding: 12px 20px;
      border-radius: 20px;
      border: 2px dashed #FFD54F;
    }

    .score-item {
      font-size: 18px;
      color: #555;
    }

    .score-item span {
      font-size: 22px;
      color: #FF5722;
      font-weight: bold;
    }

    /* 문제 영역 */
    .question-box {
      background: #F1F8E9;
      border: 3px solid #81C784;
      border-radius: 28px;
      padding: 28px 16px;
      margin-bottom: 28px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.05);
    }

    .question-text {
      font-size: 52px;
      letter-spacing: 4px;
      color: #2E7D32;
    }

    /* 입력 영역 */
    .input-wrapper {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    input[type="number"] {
      width: 140px;
      height: 64px;
      border: 3px solid #FFB300;
      border-radius: 20px;
      font-size: 38px;
      text-align: center;
      color: #333;
      outline: none;
      background: #FFFDE7;
      transition: all 0.2s ease;
      -moz-appearance: textfield;
    }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type="number"]:focus {
      border-color: #FF8F00;
      background: #FFF;
      box-shadow: 0 0 12px rgba(255, 179, 0, 0.4);
      transform: scale(1.05);
    }

    .btn-check {
      height: 64px;
      padding: 0 28px;
      font-size: 24px;
      color: white;
      background: linear-gradient(180deg, #4CAF50 0%, #388E3C 100%);
      border: none;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 6px 0 #2E7D32, 0 10px 15px rgba(0,0,0,0.1);
      transition: all 0.1s ease;
    }

    .btn-check:hover {
      background: linear-gradient(180deg, #66BB6A 0%, #43A047 100%);
    }

    .btn-check:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #2E7D32;
    }

    /* 피드백 및 결과 영역 */
    .feedback-box {
      min-height: 85px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      border-radius: 20px;
      padding: 10px 16px;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .feedback-box.correct {
      background-color: #E8F5E9;
      animation: pop 0.4s ease forwards;
    }

    .feedback-box.wrong {
      background-color: #FFEBEE;
      animation: shake 0.4s ease forwards;
    }

    .feedback-big {
      font-size: 42px;
      font-weight: bold;
      line-height: 1.2;
    }

    .feedback-big.correct-text {
      color: #2E7D32;
    }

    .feedback-big.wrong-text {
      font-size: 24px;
      color: #D32F2F;
    }

    .btn-next {
      display: none;
      width: 100%;
      height: 60px;
      font-size: 24px;
      color: white;
      background: linear-gradient(180deg, #FF9800 0%, #F57C00 100%);
      border: none;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 6px 0 #E65100, 0 10px 15px rgba(0,0,0,0.1);
      transition: all 0.1s ease;
    }

    .btn-next:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #E65100;
    }

    @keyframes pop {
      0% { transform: scale(0.85); opacity: 0; }
      70% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
  </style>
</head>
<body>

  <div class="game-card">
    <div class="badge-deco">초등 2학년</div>
    <h1>🌟 구구단 놀이터 🌟</h1>
    <p class="subtitle">문제를 보고 정답을 맞춰보세요!</p>

    <div class="score-board">
      <div class="score-item">맞힌 개수: <span id="correct-count">0</span>개</div>
      <div class="score-item">도전 횟수: <span id="total-count">0</span>회</div>
    </div>

    <!-- 문제 표시 -->
    <div class="question-box">
      <div class="question-text" id="question">2 × 3 = ?</div>
    </div>

    <!-- 답안 입력 -->
    <div class="input-wrapper" id="input-container">
      <input type="number" id="user-answer" placeholder="?" autocomplete="off" />
      <button class="btn-check" id="btn-submit">확인</button>
    </div>

    <!-- 결과 안내 문구 -->
    <div class="feedback-box" id="feedback"></div>

    <!-- 다음 문제 버튼 -->
    <button class="btn-next" id="btn-next">다음 문제 풀기 ➡️</button>
  </div>

  <script>
    let num1 = 2;
    let num2 = 1;
    let correctCount = 0;
    let totalCount = 0;

    const questionEl = document.getElementById('question');
    const answerInput = document.getElementById('user-answer');
    const submitBtn = document.getElementById('btn-submit');
    const feedbackBox = document.getElementById('feedback');
    const nextBtn = document.getElementById('btn-next');
    const correctCountEl = document.getElementById('correct-count');
    const totalCountEl = document.getElementById('total-count');

    // 새 문제 생성 함수 (2단 ~ 9단, 곱하는 수도 1 ~ 9)
    function generateQuestion() {
      num1 = Math.floor(Math.random() * 8) + 2; // 2 ~ 9
      num2 = Math.floor(Math.random() * 9) + 1; // 1 ~ 9

      questionEl.textContent = `${num1} × ${num2} = ?`;
      answerInput.value = '';
      answerInput.disabled = false;
      submitBtn.disabled = false;
      feedbackBox.className = 'feedback-box';
      feedbackBox.innerHTML = '';
      nextBtn.style.display = 'none';
      answerInput.focus();
    }

    // 정답 체크 함수
    function checkAnswer() {
      const userVal = answerInput.value.trim();

      if (userVal === '') {
        alert('정답을 입력창에 적어주세요! 😊');
        answerInput.focus();
        return;
      }

      const userAnswer = parseInt(userVal, 10);
      const correctAnswer = num1 * num2;
      totalCount++;

      answerInput.disabled = true;
      submitBtn.disabled = true;

      if (userAnswer === correctAnswer) {
        correctCount++;
        feedbackBox.className = 'feedback-box correct';
        feedbackBox.innerHTML = `<span class="feedback-big correct-text">🎉 정답! 🎉</span>`;
      } else {
        feedbackBox.className = 'feedback-box wrong';
        feedbackBox.innerHTML = `<span class="feedback-big wrong-text">😢 아쉬워요! 정답은 <strong>${correctAnswer}</strong>이에요.</span>`;
      }

      correctCountEl.textContent = correctCount;
      totalCountEl.textContent = totalCount;
      nextBtn.style.display = 'block';
      nextBtn.focus();
    }

    // 이벤트 리스너 등록
    submitBtn.addEventListener('click', checkAnswer);

    answerInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        checkAnswer();
      }
    });

    nextBtn.addEventListener('click', generateQuestion);

    // 초기 문제 출제
    generateQuestion();
  </script>
</body>
</html>
